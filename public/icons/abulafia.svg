<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">ABULAFIA.EXE</title>
  <desc id="d">An octagonal containment frame with cardinal markers around a luminous cyan point, on a deep void ground.</desc>
  <defs>
    <radialGradient id="ground" cx="50%" cy="38%" r="78%">
      <stop offset="0" stop-color="#0d0d18"/>
      <stop offset="0.55" stop-color="#050505"/>
      <stop offset="1" stop-color="#020203"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#b8ffff" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#00ffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#00ffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#ground)"/>

  <!-- Motes, echoing the constellation field. -->
  <g fill="#e2ecf8" opacity="0.5">
    <circle cx="96" cy="118" r="2.4"/>
    <circle cx="416" cy="146" r="2"/>
    <circle cx="132" cy="392" r="1.8"/>
    <circle cx="398" cy="382" r="2.2"/>
  </g>
  <g fill="#00ffff" opacity="0.55">
    <circle cx="358" cy="96" r="2.2"/>
    <circle cx="112" cy="268" r="2"/>
  </g>

  <!-- The breath halo. -->
  <circle cx="256" cy="256" r="96" fill="url(#core)"/>

  <!-- Segmented outer ring. -->
  <polygon points="256,88 375,137 424,256 375,375 256,424 137,375 88,256 137,137"
           fill="none" stroke="#f2f4fa" stroke-width="2" stroke-dasharray="3 16" opacity="0.4"/>

  <!-- Containment frame. -->
  <polygon points="256,110 359,153 402,256 359,359 256,402 153,359 110,256 153,153"
           fill="none" stroke="#f2f4fa" stroke-width="9" stroke-linejoin="miter"/>

  <!-- Orbital trace. -->
  <circle cx="256" cy="256" r="128" fill="none" stroke="#f2f4fa"
          stroke-width="3" stroke-dasharray="10 12" opacity="0.65"/>

  <!-- Cardinal markers. The upward one burns, as holam does at the first gate. -->
  <g stroke-width="7" stroke-linecap="butt">
    <line x1="256" y1="110" x2="256" y2="74" stroke="#00ffff" filter="url(#glow)"/>
    <line x1="402" y1="256" x2="438" y2="256" stroke="#f2f4fa" opacity="0.5"/>
    <line x1="256" y1="402" x2="256" y2="438" stroke="#f2f4fa" opacity="0.5"/>
    <line x1="110" y1="256" x2="74" y2="256" stroke="#f2f4fa" opacity="0.5"/>
  </g>
  <g>
    <rect x="247" y="62" width="18" height="18" fill="#00ffff" filter="url(#glow)"/>
    <rect x="430" y="247" width="16" height="16" fill="#f2f4fa" opacity="0.5"/>
    <rect x="248" y="430" width="16" height="16" fill="#f2f4fa" opacity="0.5"/>
    <rect x="66" y="247" width="16" height="16" fill="#f2f4fa" opacity="0.5"/>
  </g>

  <!-- The operative point. -->
  <circle cx="256" cy="256" r="34" fill="none" stroke="#f2f4fa" stroke-width="3" opacity="0.55"/>
  <circle cx="256" cy="256" r="15" fill="#b8ffff" filter="url(#glow)"/>
</svg>

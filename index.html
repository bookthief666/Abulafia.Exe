    <!-- Fonts are vendored under /fonts and declared in src/theme/fonts.css,
         so the chamber renders in its own typography with no network round
         trip and no flash of fallback serif. The two faces that carry its
         identity are fetched up front. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/cinzel-400-latin.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/unifrakturcook-700-latin.woff2"
      crossorigin
